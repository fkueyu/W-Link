name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  checks:
    name: Analyze & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 -m unittest discover -s tool/release -p 'test_*.py'

  android:
    name: Android AAB & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD',
                   'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Android release signing secrets are required.')
          Path('android/app/upload-keystore.jks').write_bytes(
              base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          def escaped(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {
              'storePassword': os.environ['ANDROID_STORE_PASSWORD'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'storeFile': 'upload-keystore.jks',
          }
          Path('android/key.properties').write_text(
              ''.join(f'{key}={escaped(value)}\n' for key, value in values.items()))
          PY
      - name: Build Android
        run: |
          flutter build appbundle --release --no-pub
          flutter build apk --release --no-pub
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab dist/
          cp build/app/outputs/flutter-apk/app-release.apk dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          if-no-files-found: error
          path: |
            dist/app-release.aab
            dist/app-release.apk

  macos:
    name: macOS Universal
    runs-on: macos-15
    env:
      # Xcode 26 preserves the existing macOS deployment floor.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release --no-pub
      - name: Verify version and universal architectures
        run: |
          python3 tool/release/verify_apple_bundle.py "build/macos/Build/Products/Release/W-Link.app"
          lipo -archs "build/macos/Build/Products/Release/W-Link.app/Contents/MacOS/W-Link" | grep -q arm64
          lipo -archs "build/macos/Build/Products/Release/W-Link.app/Contents/MacOS/W-Link" | grep -q x86_64
      - name: Package macOS
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/W-Link.app" dist/W-Link_macos_universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/W-Link_macos_universal.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub
      - name: Verify executable version and package full runtime
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $version = (Get-Item "$releaseDir/W-Link.exe").VersionInfo
          $expected = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)\s*$').Matches
          if ($expected.Count -ne 1) { throw "Invalid application version" }
          $parts = @($version.FileMajorPart, $version.FileMinorPart, $version.FileBuildPart, $version.FilePrivatePart)
          for ($i = 0; $i -lt 4; $i++) {
            if ($parts[$i] -ne [int]$expected[0].Groups[$i + 1].Value) {
              throw "Executable version does not match pubspec.yaml"
            }
          }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crtPath = Get-ChildItem "$vsPath/VC/Redist/MSVC" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64/Microsoft.VC143.CRT" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $crtPath) { throw "Missing Visual C++ runtime for portable package" }
          Copy-Item "$crtPath/*.dll" $releaseDir
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$releaseDir/*" -DestinationPath dist/W-Link_windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/W-Link_windows_x64.zip
          if-no-files-found: error

  ios:
    name: iPhone & iPad archive
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ipa --release --no-codesign --no-pub
      - name: Verify universal device support and version
        run: python3 tool/release/verify_apple_bundle.py build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app --ios
      - name: Package unsigned archive for signing
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/archive/Runner.xcarchive W-Link_iOS_iPadOS_unsigned.xcarchive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipados-unsigned-archive
          path: W-Link_iOS_iPadOS_unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish all desktop and Android assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, android, macos, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/app-release.aab
            dist/app-release.apk
            dist/W-Link_macos_universal.zip
            dist/W-Link_windows_x64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
